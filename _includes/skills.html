{% assign skills = site.data.data.skills %}
{% if skills and skills.groups.size > 0 %}
<section class="section reveal" id="skills">
  {% include section-title.html icon="fa-wrench" title=skills.title %}
  <dl class="skill-groups">
    {% for g in skills.groups %}
    <div class="skill-group">
      <dt>{{ g.name }}</dt>
      <dd class="chips">{% for t in g.items %}<span class="chip">{{ t }}</span>{% endfor %}</dd>
    </div>
    {% endfor %}
  </dl>
</section>
{% endif %}
