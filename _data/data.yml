# ---------- 본문 ----------
about:
  title: About
  summary: |
    Geonhyeong Park received the B.S. degree in Electrical Engineering from Myongji University,
    Korea, in 2025. He is currently pursuing the integrated M.S. and Ph.D. degree in Electrical
    Engineering at the Ulsan National Institute of Science and Technology (UNIST), Ulsan, Korea,
    working with Prof. Heechun Park in the Semiconductor Design Automation (SeDA) Lab.
    His research focuses on physical design for 3D ICs, particularly clock tree synthesis,
    and on applying AI to electronic design automation.
  research_interests:
  - 3D ICs
  - Clock Tree Synthesis (CTS)
  - AI for EDA

